name: Refresh profile activity

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: automation/refresh-activity
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch data and render images
        run: |
          node scripts/profile-art/fetch-activity.mjs
          node scripts/profile-art/render.mjs
          node scripts/profile-art/verify-readme.mjs
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: Open a pull request when the images changed
        run: |
          if git diff --quiet -- profile; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add profile
          git commit -m "chore: 🔄 refresh the profile activity images"
          git push --force origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')" ]; then
            gh pr create --head "$BRANCH" --base main \
              --title "chore: 🔄 refresh the profile activity images" \
              --body "Regenerated by scripts/profile-art from the GitHub API. Review the images, then merge."
          fi
