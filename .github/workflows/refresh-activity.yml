name: Refresh profile activity

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: refresh-activity
  cancel-in-progress: false

jobs:
  # Renders the images. Read-only token; the token is only visible to the fetch
  # step, never to Chrome.
  render:
    if: github.repository == 'finolabs/.github' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch data
        run: node scripts/profile-art/fetch-activity.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Render images and check the README
        run: |
          node scripts/profile-art/render.mjs
          node scripts/profile-art/verify-readme.mjs
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: profile
          path: |
            profile/assets
            profile/data
          if-no-files-found: error
          retention-days: 3

  # Commits the result and opens a pull request. No Chrome and no rendering here.
  publish:
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: automation/refresh-activity
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: profile
          path: profile
      - name: Open a pull request when the images changed
        run: |
          # The data file changes every run (as_of); only changed images are worth a PR.
          if [ -z "$(git status --porcelain -- profile/assets)" ]; then
            echo "Images unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add profile/assets profile/data
          git commit -m "chore: 🔄 refresh the profile activity images"
          git push --force origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')" ]; then
            gh pr create --head "$BRANCH" --base main \
              --title "chore: 🔄 refresh the profile activity images" \
              --body "Regenerated by scripts/profile-art from the GitHub API. Review the images, then merge."
          fi
